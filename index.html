<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マエダ Alert</title>

<!-- ホーム画面アイコン（ロゴ）。同じフォルダの icon.png を使う -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest?v=2">

<!-- スマホでアプリのように全画面表示する設定 -->
<meta name="theme-color" content="#f7b500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マエダ Alert">

<style>
  html, body { margin:0; padding:0; height:100%; background:#fff7e0; }
  iframe { border:0; width:100%; height:100%; display:block; }
  /* 通知許可のかぶせ画面（iOSは「押した本人のページ」でしか許可を求められないため、ここで一度押してもらう） */
  #pushOv { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
            align-items:center; justify-content:center; z-index:99;
            font-family:-apple-system, "Hiragino Sans", system-ui, sans-serif; }
  #pushOv.on { display:flex; }
  .pushOvCard { background:#fff; border-radius:16px; padding:22px 18px; width:min(320px, 86vw); text-align:center;
                box-shadow:0 8px 30px rgba(0,0,0,.25); }
  .pushOvCard h2 { margin:0 0 8px; font-size:17px; color:#333; }
  .pushOvCard p { margin:0 0 16px; font-size:14px; color:#555; line-height:1.6; }
  .pushOvCard .go { display:block; width:100%; padding:15px 8px; border:none; border-radius:12px;
                    background:#f7b500; color:#3a2c00; font-size:16px; font-weight:700; }
  .pushOvCard .quit { margin-top:12px; background:none; border:none; color:#888; font-size:13px; text-decoration:underline; }
</style>

<!-- LIFF（LINEの中で開いたとき、LINEに「誰か」を教えてもらう仕組み） -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- 直通知（Firebase Cloud Messaging）。設定が空のあいだは読み込むだけで何もしない -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
</head>
<body>
  <!-- マエダ Alert 本体（Google Apps Script）を全画面で表示。URLの引数（?u= ?cast= など）は本体へそのまま引き継ぐ -->
  <iframe id="app" allow="geolocation; clipboard-write" title="マエダ Alert"></iframe>

  <!-- 通知許可のかぶせ画面（ふだんは非表示） -->
  <div id="pushOv">
    <div class="pushOvCard">
      <h2>🔔 アプリへの直通知</h2>
      <p>次に出る画面で<br>「許可」を押してください</p>
      <button type="button" class="go" id="pushOvGo">許可の画面を出す</button>
      <button type="button" class="quit" id="pushOvQuit">やめる</button>
    </div>
  </div>
  <script>
    var GAS = 'https://script.google.com/macros/s/AKfycbwAt4xgxvFWBBYKj40G4EDq1wgG7fAdC7kmnjDAAvnskC9pfAHeJ0APDJe1E2790Ij3/exec';
    var LIFF_ID = '2011265297-cgdkzrS4';
    var PAGE_VER = '配布v7';   // エラー文言に載せて「どの版が動いているか」を見える化する

    // ▼ 直通知（Phase B）。★下の2つを貼ると有効になる（空のあいだは静かに無効＝従来どおり）
    var FB_CONFIG = {
      apiKey: "AIzaSyDYj-b1qg_VBM2CsElt7gKnfnEAz-dni2o",
      authDomain: "maeda-alert.firebaseapp.com",
      projectId: "maeda-alert",
      storageBucket: "maeda-alert.firebasestorage.app",
      messagingSenderId: "1077728788153",
      appId: "1:1077728788153:web:d411a7757f143ba5dca568"
    };
    var VAPID_KEY = 'BGXw3IT_T6Z2nz1Qs8l6tIhAVtiN6K3NM8Eknc_jbw1VzAu1F23FhHsCelXdVR2QtOtzhqXanc5nL7R_lFhKj_c';

    function boot(extra) {
      var qs = location.search || '';
      document.getElementById('app').src = GAS + qs + (extra ? ((qs ? '&' : '?') + extra) : '');
    }

    // LINEの中でLIFFとして開かれたときだけ、本人（LINEユーザーID）を本体へ渡す。
    // それ以外（Safari・ホーム画面・LIFF未設定・失敗時）は従来どおり＝安全側。
    if (LIFF_ID && window.liff) {
      liff.init({ liffId: LIFF_ID }).then(function () {
        var ctx = liff.getContext && liff.getContext();
        var uid = (liff.isInClient() && ctx && ctx.userId) ? ctx.userId : '';
        boot(uid ? ('luid=' + encodeURIComponent(uid)) : '');
      }).catch(function () { boot(''); });
    } else {
      boot('');
    }

    // ─── 直通知の受付（アプリ本体からの橋渡し）───
    // 通知の許可と宛先（トークン）取得は、このページの持ち場（本体はGoogleのドメインのため不可）。
    var swReg = null, fbMessaging = null;
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    var standalone = (navigator.standalone === true) ||
                     (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    function pushSupported() {
      return !!(FB_CONFIG && VAPID_KEY && 'serviceWorker' in navigator && 'Notification' in window &&
                (!isIOS || standalone));   // iPhoneはホーム画面のアプリとして開いたときだけ
    }
    if (FB_CONFIG && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./firebase-messaging-sw.js?v=4', { updateViaCache: 'none' }).then(function (r) { swReg = r; }).catch(function () {});
      try { firebase.initializeApp(FB_CONFIG); fbMessaging = firebase.messaging(); } catch (e) {}
    }
    function pushStatusMsg() {
      return { maedaPush: 'status', supported: pushSupported(), ios: isIOS, standalone: standalone,
               permission: ('Notification' in window) ? Notification.permission : 'unsupported' };
    }
    // 宛先（トークン）の発行。どの段階で失敗しても必ず返事を返す（返さないと本体が「設定中…」のまま止まる）
    function fetchPushToken_(app) {
      var done = false;
      var send = function (msg) { if (done) return; done = true; app.postMessage(msg, '*'); };
      var stage = '裏方の準備';
      setTimeout(function () { send({ maedaPush: 'error', reason: 'timeout' }); }, 25000);
      // 起動時の登録が失敗していても、ここでもう一度登録し直す（.readyは失敗時に永久に待つため使わない）
      var ready = swReg ? Promise.resolve(swReg)
                        : navigator.serviceWorker.register('./firebase-messaging-sw.js?v=4', { updateViaCache: 'none' });
      ready.then(function (reg) {
        swReg = reg; stage = '宛先の発行';
        if (!fbMessaging) { firebase.initializeApp(FB_CONFIG); fbMessaging = firebase.messaging(); }
        return fbMessaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      }).then(function (token) {
        send({ maedaPush: 'token', token: token || '' });
      }).catch(function (e) {
        send({ maedaPush: 'error', reason: stage + 'で失敗(' + PAGE_VER + '): ' + String(e && e.message || e).slice(0, 100) });
      });
    }

    // かぶせ画面：iOSは「押した本人のページ」でしか許可を求められない。
    // タップは本体（Googleの枠の中）で起きるため、このページ自身のボタンを一度押してもらう。
    var ovApp = null, ovTimer = null;
    function hidePushOv_() {
      document.getElementById('pushOv').classList.remove('on');
      if (ovTimer) { clearTimeout(ovTimer); ovTimer = null; }
      ovApp = null;
    }
    function showPushOv_(app) {
      ovApp = app;
      document.getElementById('pushOv').classList.add('on');
      if (ovTimer) clearTimeout(ovTimer);
      ovTimer = setTimeout(function () {
        var a = ovApp; hidePushOv_();
        if (a) a.postMessage({ maedaPush: 'error', reason: 'timeout' }, '*');
      }, 50000);
    }
    document.getElementById('pushOvQuit').onclick = function () {
      var a = ovApp; hidePushOv_();
      if (a) a.postMessage({ maedaPush: 'error', reason: 'cancel' }, '*');
    };
    document.getElementById('pushOvGo').onclick = function () {
      var a = ovApp; hidePushOv_();
      if (!a) return;
      Promise.resolve().then(function () { return Notification.requestPermission(); }).then(function (p) {
        if (p !== 'granted') { a.postMessage({ maedaPush: 'error', reason: 'denied' }, '*'); return; }
        fetchPushToken_(a);
      }).catch(function (e) {
        a.postMessage({ maedaPush: 'error', reason: '許可で失敗(' + PAGE_VER + '): ' + String(e && e.message || e).slice(0, 100) }, '*');
      });
    };

    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (!d || !d.maedaPush) return;
      // 返事は「訊いてきた枠」へ（本体はGoogleのラッパー枠の中の孫にあたるため、子宛てでは届かない）
      var app = ev.source || document.getElementById('app').contentWindow;
      if (d.maedaPush === 'query') { app.postMessage(pushStatusMsg(), '*'); return; }
      if (d.maedaPush === 'subscribe') {
        if (!pushSupported()) { app.postMessage({ maedaPush: 'error', reason: 'unsupported' }, '*'); return; }
        if (Notification.permission === 'granted') { fetchPushToken_(app); return; }   // 許可済みなら即発行
        if (Notification.permission === 'denied') { app.postMessage({ maedaPush: 'error', reason: 'denied' }, '*'); return; }
        showPushOv_(app);
      }
    });
  </script>
</body>
</html>
